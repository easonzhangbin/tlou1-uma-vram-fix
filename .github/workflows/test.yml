name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run rejection and hardware eligibility tests
        shell: powershell
        run: |
          ./tests/Test.ps1
          ./tests/RenderMenu.Tests.ps1
  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run rejection and hardware eligibility tests
        shell: pwsh
        run: |
          ./tests/Test.ps1
          ./tests/RenderMenu.Tests.ps1
